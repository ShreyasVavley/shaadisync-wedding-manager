services:
  shaadisync:
    build: .
    container_name: shaadisync-wedding-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=http://localhost:3000
      - META_WHATSAPP_TOKEN=${META_WHATSAPP_TOKEN:-}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:-shaadi_sync_verify_123}
    volumes:
      - wedding_data:/app/server/data

volumes:
  wedding_data:
    driver: local
